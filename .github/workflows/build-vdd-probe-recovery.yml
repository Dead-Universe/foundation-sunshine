name: Build VDD Probe Recovery Fast

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: vdd-probe-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RECOVERY_VERSION: vdd-recovery-fast-${{ github.run_number }}.杂鱼
  BASE_PORTABLE_RUN_ID: '32571343151'
  BASE_PORTABLE_ARTIFACT: sunshine-vdd-probe-recovery-portable-r4

jobs:
  build_win_fast:
    name: Windows recovery fast build
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Apply latest DDX-open-failure VDD recovery
        shell: pwsh
        run: |
          python .\scripts\apply-vdd-probe-recovery.py
          git diff --check
          git diff -- src/video.cpp

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            curl

      - name: Install Windows build dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget -q https://repo.msys2.org/mingw/ucrt64/${opus_tarball}
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-ccache"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )
          pacman -Syu --noconfirm "${dependencies[@]}"
          pacman --noconfirm -U ${opus_tarball}

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-vdd-fast-${{ github.run_id }}
          restore-keys: |
            ccache-vdd-fast-
            ccache-vdd-recovery-
            ccache-windows-

      - name: Build patched Sunshine executable only
        shell: msys2 {0}
        env:
          BRANCH: codex/vdd-ddx-probe-recovery
          BUILD_VERSION: ${{ env.RECOVERY_VERSION }}
          COMMIT: ${{ github.sha }}
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          DRIVER_DEPS_REQUIRED: OFF
        run: |
          mkdir -p build
          ccache --zero-stats
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TRAY_TESTS=OFF \
            -DBUILD_WEB_UI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DDRIVER_DEPS_REQUIRED=OFF \
            -DSUNSHINE_PUBLISHER_NAME='Dead-Universe' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/Dead-Universe/foundation-sunshine' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/Dead-Universe/foundation-sunshine/issues'
          ninja -C build sunshine
          ccache --show-stats
          find build -iname 'sunshine.exe' -type f -print

      - name: Download last known-good portable shell
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BASE_PORTABLE_ARTIFACT }}
          path: base-portable
          repository: Dead-Universe/foundation-sunshine
          run-id: ${{ env.BASE_PORTABLE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay patched executable into portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts, fast-portable | Out-Null

          $baseZip = Get-ChildItem -Path base-portable -Recurse -File -Filter 'Sunshine.VDD-Probe-Recovery.Portable-x64.zip' | Select-Object -First 1
          if (-not $baseZip) { throw 'Base r4 portable ZIP was not found in downloaded artifact.' }
          Expand-Archive -Path $baseZip.FullName -DestinationPath fast-portable -Force

          $builtExe = Get-ChildItem -Path build -Recurse -File -Filter 'sunshine.exe' | Select-Object -First 1
          if (-not $builtExe) { throw 'Freshly built sunshine.exe was not found.' }

          $targetExe = Get-ChildItem -Path fast-portable -Recurse -File -Filter 'sunshine.exe' | Select-Object -First 1
          if (-not $targetExe) { throw 'sunshine.exe was not found inside the r4 portable package.' }

          Copy-Item -Path $builtExe.FullName -Destination $targetExe.FullName -Force
          Compress-Archive -Path 'fast-portable\*' -DestinationPath 'artifacts\Sunshine.VDD-Probe-Recovery.Fast.Portable-x64.zip' -CompressionLevel Optimal -Force

          git diff -- src/video.cpp | Out-File -FilePath 'artifacts\vdd-probe-recovery.patch' -Encoding utf8
          git rev-parse HEAD | Out-File -FilePath 'artifacts\source-commit.txt' -Encoding ascii
          Get-FileHash 'artifacts\Sunshine.VDD-Probe-Recovery.Fast.Portable-x64.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Sunshine.VDD-Probe-Recovery.Fast.Portable-x64.zip" } |
            Out-File -FilePath 'artifacts\SHA256SUMS.txt' -Encoding ascii

      - name: Upload fast portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-vdd-probe-recovery-fast-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.VDD-Probe-Recovery.Fast.Portable-x64.zip
            artifacts/vdd-probe-recovery.patch
            artifacts/source-commit.txt
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
